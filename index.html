<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishnu Studio | Booking & Custom Printing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #121212; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #1a1a1a; border: 1px solid #d4af37; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15); }
        h1 { color: #d4af37; text-align: center; font-size: 28px; letter-spacing: 1px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 15px; }
        .contact-box { text-align: center; margin-bottom: 20px; }
        .contact-btn { color: #25D366; text-decoration: none; font-weight: bold; font-size: 15px; background: #222; padding: 8px 16px; border-radius: 20px; border: 1px solid #25D366; display: inline-block; }
        .form-group { margin-bottom: 18px; }
        label { font-size: 14px; color: #d4af37; display: block; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 12px; background: #262626; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 14px; }
        input:focus, select:focus, textarea:focus { border-color: #d4af37; outline: none; }
        button { width: 100%; padding: 14px; background: #d4af37; color: #121212; font-weight: bold; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #f3cf55; }
    </style>
</head>
<body>

<div class="card">
    <h1>VISHNU STUDIO</h1>
    <p class="subtitle">Wedding, Photography & Custom Gift Printing</p>

    <div class="contact-box">
        <a href="https://wa.me/918909158011" target="_blank" class="contact-btn">
            💬 Call / WhatsApp: +91 8909158011
        </a>
    </div>

    <form action="/book" method="POST">
        <div class="form-group">
            <label>Aapka Naam:</label>
            <input type="text" name="name" placeholder="Apna naam daalein" required>
        </div>

        <div class="form-group">
            <label>Phone Number:</label>
            <input type="tel" name="phone" placeholder="Mobile number daalein" required>
        </div>

        <div class="form-group">
            <label>Category Select Karein:</label>
            <select name="category" id="categorySelect" onchange="updateServices()" required>
                <option value="Photography Shoot">Photography Shoot</option>
                <option value="Photo Frames">Photo Frames & Wall Art</option>
                <option value="Custom Gifts">Custom Printing & Gifts</option>
            </select>
        </div>

        <div class="form-group">
            <label>Select Item / Service:</label>
            <select name="service" id="serviceSelect" required>
                <!-- Options via JS -->
            </select>
        </div>

        <div class="form-group">
            <label>Date (For Shoot / Delivery):</label>
            <input type="date" name="shoot_date">
        </div>

        <div class="form-group">
            <label>Message / Address / Quantity:</label>
            <textarea name="address" rows="3" placeholder="Requirement ya delivery address daalein..."></textarea>
        </div>

        <button type="submit">Submit Request</button>
    </form>
</div>

<script>
    const optionsData = {
        "Photography Shoot": [
            "Wedding Photography",
            "Pre-Wedding Shoot",
            "Cinematic Wedding Film",
            "Birthday & Event Shoot",
            "Live Telecast / Streaming",
            "Maternity & Baby Shoot"
        ],
        "Photo Frames": [
            "Synthetic / Wooden Frame (8x10 inch) - ₹500+",
            "Synthetic / Wooden Frame (12x18 inch) - ₹850+",
            "3D Glossy Acrylic Frame (12x18 inch) - ₹1,200",
            "Canvas Print Frame (18x24 inch) - ₹2,500",
            "LED Light Photo Frame - ₹650",
            "Multi-Photo Collage Frame - ₹1,100"
        ],
        "Custom Gifts": [
            "Custom Photo Keychain (Acrylic/Metal) - ₹150",
            "Heat Sensitive Magic Mug - ₹250",
            "Normal Ceramic Photo Mug - ₹200",
            "Custom Printed T-Shirt (Polyester) - ₹300",
            "Custom Printed T-Shirt (100% Cotton) - ₹500",
            "Custom Photo Cushion / Pillow - ₹450",
            "Custom Stainless Steel Photo Bottle - ₹550"
        ]
    };

    function updateServices() {
        const category = document.getElementById("categorySelect").value;
        const serviceSelect = document.getElementById("serviceSelect");
        serviceSelect.innerHTML = "";

        optionsData[category].forEach(item => {
            let option = document.createElement("option");
            option.value = item;
            option.textContent = item;
            serviceSelect.appendChild(option);
        });
    }

    updateServices();
</script>

</body>
</html>
